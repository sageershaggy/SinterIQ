# ============================================================
# HOST nginx vhost for Innovista Research AI.
# Copy to /etc/nginx/http.d/innovista-research-ai.conf on the VPS (Alpine path).
# Mirrors the existing pomotoro.conf / jenkins.conf pattern.
#
# This is the ONLY host-level change Innovista Research AI needs. It is purely additive and
# does not touch pomotoro / tawazun / sentry / jenkins vhosts.
#
# Install (as root on the VPS):
#   1. Put this file at /etc/nginx/http.d/innovista-research-ai.conf
#   2. nginx -t && rc-service nginx reload
#   3. Issue TLS (certbot edits this file in place to add :443 + the redirect):
#        certbot --nginx -d innovista-research-ai.zengineeringapp.com \
#          --non-interactive --agree-tos --redirect
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name innovista-research-ai.zengineeringapp.com;

    # certbot adds the 443 server block + http->https redirect on first issue.
    # Until then this serves over :80 so the ACME http-01 challenge succeeds.

    # Training-source uploads (PDF/DOCX) are capped at 5 MB by multer and the
    # JSON body limit is 1 MB. 10m leaves headroom for multipart overhead.
    client_max_body_size 10m;

    location / {
        proxy_pass         http://127.0.0.1:8110;
        proxy_http_version 1.1;

        # Host MUST be forwarded verbatim: server/app.ts rejects any Host that
        # is not INNOVISTA_ORIGIN's host (or localhost:3000) with 403.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Required: with INNOVISTA_TRUST_PROXY=1 the app trusts this to know the
        # request was HTTPS, which is what makes `secure` session cookies work.
        proxy_set_header   X-Forwarded-Proto $scheme;

        # AI training analysis and batch qualification are long requests
        # (server.ts sets requestTimeout to 120s; batches of up to 20 leads).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # No Upgrade/Connection headers: the production app has no WebSocket
        # endpoint (Vite HMR is development-only), so upgrade plumbing would
        # only risk confusing keep-alive here.
    }
}
